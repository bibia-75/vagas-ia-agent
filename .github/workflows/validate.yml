name: Validate Vagas IA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py
      - name: Test account isolation
        env:
          APP_USER: ci-owner
          APP_PASSWORD: ci-owner-password
          APP_SECRET: ci-session-secret-for-tests
        run: python -m unittest discover -s tests -v
      - name: Test migration of existing user data
        run: python tests/check_legacy_migration.py
