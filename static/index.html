<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vagas IA</title>
<style>
:root{font-family:Inter,system-ui,Arial;color:#262626;background:#f6f4f2}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px 18px}h1{margin:0 0 6px}.muted{color:#69645f}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}button{border:0;border-radius:10px;padding:12px 16px;background:#4c3933;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e7ded9;color:#342a26}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat,.job{background:white;border:1px solid #e7e1dd;border-radius:14px;padding:16px}.stat strong{display:block;font-size:26px}.jobs{display:grid;gap:10px;margin-top:16px}.job h3{margin:0 0 6px;font-size:17px}.job a{color:#4c3933}.row{display:flex;justify-content:space-between;gap:12px;align-items:start}.pill{font-size:12px;background:#f3ece8;border-radius:20px;padding:5px 9px;white-space:nowrap}.job select{padding:8px;border:1px solid #ddd;border-radius:8px;margin-top:12px}.notice{margin:14px 0;padding:12px;background:#fff8e7;border-radius:10px}.status{margin-top:12px;white-space:pre-wrap}.small{font-size:13px}@media(max-width:650px){.stats{grid-template-columns:1fr}.row{display:block}}
</style></head><body><main class="wrap">
<h1>Vagas IA</h1><div class="muted">Busca de oportunidades remotas • execução sob demanda</div>
<div class="notice">Esta versão pesquisa e organiza vagas. Ela ainda não envia candidaturas automaticamente. Não marque uma candidatura como enviada sem confirmar o envio real.</div>
<div class="actions"><button id="search">Buscar vagas automaticamente</button><button class="secondary" id="refresh">Atualizar painel</button></div>
<div class="stats"><div class="stat"><span class="muted">Vagas salvas</span><strong id="total">—</strong></div><div class="stat"><span class="muted">Prioritárias</span><strong id="priority">—</strong></div><div class="stat"><span class="muted">Candidaturas confirmadas</span><strong id="applied">—</strong></div></div>
<div id="status" class="status muted"></div><section id="jobs" class="jobs"></section>
</main><script>
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok)throw new Error((await r.text()).slice(0,300));return r.json()}
async function load(){try{const [s,j]=await Promise.all([api('/api/stats'),api('/api/jobs')]);$('total').textContent=s.total;$('priority').textContent=s.priority;$('applied').textContent=s.applied;$('jobs').innerHTML=j.map(x=>`<article class="job"><div class="row"><div><h3>${esc(x.title)}</h3><div>${esc(x.company)} · ${esc(x.location||'Remoto')}</div><div class="small muted">${esc(x.source)} · Compatibilidade estimada: ${x.score}%</div><p><a href="${esc(x.url)}" target="_blank" rel="noopener">Abrir vaga</a></p></div><span class="pill">${esc(x.status)}</span></div><label class="small">Status: <select data-id="${x.id}"><option ${x.status==='Encontrada'?'selected':''}>Encontrada</option><option ${x.status==='Prioritária'?'selected':''}>Prioritária</option><option ${x.status==='Pronta para candidatura'?'selected':''}>Pronta para candidatura</option><option ${x.status==='Candidatura confirmada'?'selected':''}>Candidatura confirmada</option><option ${x.status==='Entrevista'?'selected':''}>Entrevista</option><option ${x.status==='Recusada'?'selected':''}>Recusada</option><option ${x.status==='Encerrada'?'selected':''}>Encerrada</option><option ${x.status==='Erro de envio'?'selected':''}>Erro de envio</option></select></label></article>`).join('')||'<div class="job muted">Nenhuma vaga salva ainda. Clique em “Buscar vagas automaticamente”.</div>';$('status').textContent='Painel atualizado.'}catch(e){$('status').textContent='Erro ao carregar: '+e.message}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('search').onclick=async()=>{ $('search').disabled=true;$('status').textContent='Buscando vagas nas fontes públicas… isso pode levar alguns segundos.';try{const r=await api('/api/search?limit=40',{method:'POST'});$('status').textContent=`Busca concluída. Novas vagas: ${r.new}. Vagas verificadas: ${r.checked}. Total salvo: ${r.total}.`+(r.errors.length?'\nAvisos: '+r.errors.join(' | '):'');await load()}catch(e){$('status').textContent='Falha na busca: '+e.message}finally{$('search').disabled=false}};
$('refresh').onclick=load;
$('jobs').onchange=async e=>{if(e.target.matches('select[data-id]')){try{await api('/api/jobs/'+e.target.dataset.id,{method:'PATCH',body:JSON.stringify({status:e.target.value})});await load()}catch(err){$('status').textContent='Não foi possível salvar status: '+err.message}}};
load();
</script></body></html>
