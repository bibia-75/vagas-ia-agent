services:
  - type: web
    name: vagas-ia-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
